name: Build Klyvren Client
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Build JAR
        run: gradle build --no-daemon
      - name: Prepare and verify JAR
        run: |
          set -e
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -ge 1
          cp "${jars[0]}" build/libs/klyvren-client-1.21.11.jar
          unzip -t build/libs/klyvren-client-1.21.11.jar
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: klyvren-client-1.21.11
          path: build/libs/klyvren-client-1.21.11.jar
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Klyvren Client 1.21.11 Build ${{ github.run_number }}
          generate_release_notes: true
          files: build/libs/klyvren-client-1.21.11.jar
